<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreeTrial Terminator preview</title>
    <link rel="icon" href="/assets/icon-b-64.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="/assets/icon-b-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/assets/icon-b-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/assets/icon-b-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/assets/fonts/ibm-plex-sans-latin-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/assets/fonts/ibm-plex-sans-latin-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/assets/fonts/cormorant-garamond-latin-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2");
      }

      :root { color-scheme: dark; }

      * { box-sizing: border-box; border-radius: 0 !important; }

      body {
        margin: 0;
        background: #04040a;
        color: #ecebe2;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 32px;
      }

      h1 {
        margin: 0 0 6px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 26px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: 0.005em;
      }

      p { margin: 0 0 8px; color: rgba(236, 235, 226, 0.65); font-size: 14px; line-height: 1.45; }

      #status {
        margin: 0 0 12px;
        color: rgba(236, 235, 226, 0.42);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      iframe {
        display: block;
        width: 100%;
        height: 640px;
        border: 1px solid rgba(236, 235, 226, 0.12);
        background: #06060e;
      }

      @media (max-width: 480px) {
        main { padding: 16px 0 24px; }
        h1, p { padding-left: 16px; padding-right: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget preview</h1>
      <p>Same panel ChatGPT renders. Buttons call the local tools.</p>
      <p id="status">Waiting for the widget</p>
      <iframe id="widget" title="FreeTrial Terminator widget"></iframe>
    </main>
    <script>
      const iframe = document.querySelector("#widget");
      const statusEl = document.querySelector("#status");

      const reply = (message) => {
        iframe.contentWindow?.postMessage(message, "*");
      };

      const callTool = async (name, args) => {
        statusEl.textContent = `Called ${name}`;
        const response = await fetch("/api/call", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, arguments: args || {} }),
        });
        if (!response.ok) throw new Error("Tool call failed");
        return response.json();
      };

      window.addEventListener("message", async (event) => {
        if (event.source !== iframe.contentWindow) return;
        const message = event.data;
        if (message?.source === "freetrial-widget" && typeof message.height === "number") {
          iframe.style.height = `${Math.ceil(message.height)}px`;
          return;
        }
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/initialize" && typeof message.id === "number") {
          reply({
            jsonrpc: "2.0",
            id: message.id,
            result: {
              protocolVersion: "2026-01-26",
              hostInfo: { name: "local-preview", version: "0.1.0" },
              hostCapabilities: {},
            },
          });
          return;
        }

        if (message.method === "ui/notifications/initialized") {
          try {
            const dashboard = await callTool("list_trials", {});
            reply({
              jsonrpc: "2.0",
              method: "ui/notifications/tool-result",
              params: dashboard,
            });
          } catch (error) {
            statusEl.textContent = error instanceof Error ? error.message : "Preview failed";
          }
          return;
        }

        if (message.method === "tools/call" && typeof message.id === "number") {
          try {
            const result = await callTool(message.params?.name, message.params?.arguments);
            reply({ jsonrpc: "2.0", id: message.id, result });
          } catch (error) {
            reply({
              jsonrpc: "2.0",
              id: message.id,
              error: { code: -32000, message: error instanceof Error ? error.message : "Tool call failed" },
            });
          }
          return;
        }

        if (typeof message.id === "number") {
          reply({ jsonrpc: "2.0", id: message.id, result: {} });
        }
      });

      iframe.src = "/widget.html";
    </script>
  </body>
</html>
